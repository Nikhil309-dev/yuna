# ===========================================================================
# Yuna V2 — Lavalink v4 server configuration
#
# Matches the defaults in .env.example and src/config/config.ts:
#   host 127.0.0.1 · port 9000 · password youshallnotpass · plain (no SSL)
#
# YouTube playback is provided by the lavalink-devs youtube-source plugin
# (the built-in YouTube source is deprecated). The plugin is downloaded
# automatically from maven.lavalink.dev on first start.
# ===========================================================================

server:
  port: 9000
  address: 0.0.0.0
  http2:
    enabled: false

# Root-level plugin config (this level is correct for plugins, not under `lavalink`)
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # If YouTube starts asking for sign-in, add an OAuth refresh token here:
    # oauth:
    #   enabled: true
    #   refreshToken: "your_refresh_token"

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
      # repository defaults to https://maven.lavalink.dev/releases

  server:
    password: "youshallnotpass"

    sources:
      youtube: false # handled by the youtube-source plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
